<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mein Adressbuch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Adressbuch</h1>

<h2>Neuen Kontakt anlegen</h2>
<input type="text" id="nameInput" placeholder="Name">
<input type="text" id="phoneInput" placeholder="Telefonnummer">
<input type="text" id="emailInput" placeholder="E-Mail-Adresse">
<button onclick="addContact()">Anlegen</button>

<h2>Kontakte</h2>

<table id="contactTable">
  <thead>
  <tr>
    <th>Name</th>
    <th>Telefonnummer</th>
    <th>E-Mail</th>
    <th>Aktionen</th>
  </tr>
  </thead>
  <tbody id="contactTableBody"></tbody>
</table>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mein Adressbuch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header-row">
  <h1>Adressbuch</h1>
  <img src="images/icons8-visitenkarte-64.png" alt="Adressbuch" width="32" height="32">
</div>

<h2>Neuen Kontakt anlegen</h2>
<button popovertarget="newContact">
  NEU
  <img src="images/plus-64.png" alt="Neuer Kontakt" width="28" height="28">

</button>

<h2>Kontakte</h2>

<h3>Suche</h3>
<input type="text" id="searchInput" placeholder="Nach Name suchen...">
<button onclick="searchContacts()">Suchen
  <img src="images/icons8-suche-64.png" alt="Suche" width="28" height="28">
</button>

<table id="contactTable">
  <thead>
  <tr>
    <th>Name</th>
    <th>Telefonnummer</th>
    <th>E-Mail</th>
    <th>Aktionen</th>
  </tr>
  </thead>
  <tbody id="contactTableBody"></tbody>
</table>
<!-- hier kommt das "Modal" - ein "Overlay", das standardmäßig nicht angezeigt wird, nur wenn man auf bearbeiten geht! -->

<div id="editModal" popover="auto">
<!--
<div id="editModal" popover="auto" style="display: none;">
-->
  <h3>Kontakt bearbeiten</h3>
  <input type="text" id="editNameInput" placeholder="Name">
  <input type="text" id="editPhoneInput" placeholder="Telefonnummer">
  <input type="text" id="editEmailInput" placeholder="E-Mail-Adresse">
  <button onclick="saveEdit()">Speichern</button>
  <button onclick="closeEditModal()">Abbrechen</button>
</div>

<div id="newContact" popover="auto">
  <!--
  <div id="editModal" popover="auto" style="display: none;">
  -->
  <h3>Neuer Kontakt</h3>
  <input type="text" id="nameInput" placeholder="Name">
  <input type="text" id="phoneInput" placeholder="Telefonnummer">
  <input type="text" id="emailInput" placeholder="E-Mail-Adresse">
  <button onclick="addContact()" popovertarget="newContact" popovertargetaction="hide">Speichern</button>
  <button popovertarget="newContact" popovertargetaction="hide">Abbrechen</button>
  <!--<button onclick="closeEditModal()">Abbrechen</button>-->
</div>

<script src="script.js"></script>

</body>
</html>
